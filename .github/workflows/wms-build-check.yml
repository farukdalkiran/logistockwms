name: WMS build check
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://pbqzbakmxrdumaeamymd.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Multinet calculations
        run: node --experimental-strip-types --test tests/multinet.test.mjs
      - name: Aras CSV reason regression
        run: node --experimental-strip-types --test tests/cargo-export.test.mjs
      - name: HR leave import regression
        run: node --experimental-strip-types --test tests/hr-leave-management.test.mjs
      - name: HR calendar regression
        run: node --experimental-strip-types --test tests/hr-upcoming-events.test.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Next.js build
        run: npm run build
